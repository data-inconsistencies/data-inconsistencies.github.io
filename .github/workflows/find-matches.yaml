name: Find new ELO matches

# Weekly: ask Claude to find new public benchmark reports, then open a PR that adds them
# to data/elo/matches.json. A human reviews every candidate against its source before merge.
# Setup: repo secret ANTHROPIC_API_KEY, and Settings > Actions > General >
# "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      max:
        description: Maximum reports to look for
        default: '10'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: find-matches
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: bot/elo-new-matches
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Look for new matches
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run find-matches -- --write --max "${{ inputs.max || '10' }}" --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate updated data
        run: npm test

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/elo/matches.json; then
            echo "No new matches; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add data/elo/matches.json
          git commit -m "Add new ELO matches found $(date -u +%Y-%m-%d)"
          git push --force origin "$BRANCH"

          {
            echo "Automated weekly search for new public benchmark reports."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "**Before merging:** open each source and confirm the date, workload, and finishing order."
            echo "Remove entries that are wrong by editing \`data/elo/matches.json\` on this branch."
          } > "$RUNNER_TEMP/body.md"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "New ELO matches ($(date -u +%Y-%m-%d))" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
