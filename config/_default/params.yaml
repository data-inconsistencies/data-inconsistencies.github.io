# HUGO BLOX CONFIGURATION
# Schema: hugoblox.com/schema/v2
# Tutorial: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/
hugoblox:
  schema: "2.0"

  # Site-level branding
  identity:
    name: "Data inconsistencies"
    organization: "datainconsistencies"
    type: person # person | organization | local_business
    description: 'Data inconsistencies, architecuture and real world stories'
    social:
      twitter: ''

  # Colors. Logo is auto-detected from `assets/media/logo.{svg,png}`.
  theme:
    mode: light # light | dark | system
    pack: "default"
    colors:
      primary: "green"

  header:
    enable: true
    block: navbar
    sticky: true
    show_logo: true
    # The logo already carries the name.
    show_title: false
    align: center
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    # cta:
    #   enable: true
    #   text: "Get Scores"
    #   url: "https://docs.google.com/spreadsheets/d/1Y1Oxw_2LBWd502JtWFFyef2y5TvOyQMkq156cDrKJbA"

  footer:
    style: minimal # minimal | columns | centered
    language_switcher: false

  copyright:
    notice: '© {year} datainconsistencies'
    license:
      type: custom # no Creative Commons badge

  search:
    enable: true

  analytics:
    google:
      measurement_id: 'G-GV8QDDVB6Q'
    google_tag_manager:
      container_id: ''  # needs a GTM-XXXX container ID; a GA4 ID here loaded a non-existent container

  verification:
    google: ''
    baidu: ''

  locale:
    date_format: 'Jan 2, 2006'
    time_format: '3:04 PM'

  privacy:
    enable: true
    anonymize_analytics: true

#  comments:
#    enable: true
#    provider: 'giscus'
#    giscus:
#      repo: 'data-inconsistencies/landingpage-comments'
#      repo_id: 'R_kgDOM_WnDw'
#      category: 'Q&A'
#      category_id: 'DIC_kwDOM_WnD84CjTmS'

# WebMCP tools on /rankings/ (docs/elo/spec.md). Chrome origin-trial token for this site's origin, from
# https://developer.chrome.com/origintrials/#/register_trial/4163014905550602241 — public, expires, renew it.
webmcp:
  originTrialToken: ''
