[build]
  # Pagefind builds the search index the theme loads from /pagefind/ (same step as publish.yaml).
  command = "npm ci && hugo --gc --minify -b $URL && npx -y pagefind --site public"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.170.1"
  NODE_VERSION = "22"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "npm ci && hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL && npx -y pagefind --site public"

[context.branch-deploy]
  command = "npm ci && hugo --gc --minify -b $DEPLOY_PRIME_URL && npx -y pagefind --site public"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true
